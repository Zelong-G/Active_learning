[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopy-active-learning"
version = "0.1.0"
description = "Agreement-based sample acquisition for instance segmentation in microscopy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Zelong Zheng"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
visualization = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Zelong-G/Active_learning"
Documentation = "https://github.com/Zelong-G/Active_learning/tree/main/docs"

[tool.setuptools.packages.find]
include = ["active_learning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
