name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check active_learning scripts tests
      - name: Unit tests
        run: pytest -q
      - name: Synthetic demo
        run: python scripts/demo.py --output-dir outputs/demo
      - name: Compile
        run: python -m compileall -q active_learning scripts
